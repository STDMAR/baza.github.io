<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>База військових правопорушень</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet">
<style id="css">
/* VOICE: службовий робочий інструмент аналітика ВСП — стриманий, точний, без прикрас
   IDEA: відомча облікова картка і журнал — таблиці, штампи стану, підсумкові довідки
   PICTURE: сама робоча база — аналітичні картки з відповідями на 10 запитань, таблиці, перевірки
   COLOUR and TYPE: оливково-коричнева смуга й помаранчевий акцент із бланка завдання; Onest + Golos Text
   LAYOUT: смуга з назвою і діями, вкладки, далі робоча область на всю ширину до 1240px */
:root{color-scheme:light dark;--bg:light-dark(#f4f1ea,#17150f);--card:light-dark(#fff,#211e17);--ink:light-dark(#2a261d,#ece6d6);--mut:light-dark(#6f6857,#a59d8a);--line:light-dark(#ddd6c6,#3a3528);--band:light-dark(#4a4232,#2a251b);--acc:#e8890c;--accs:light-dark(#fdf0dc,#3a2a10);--acct:light-dark(#8a4f00,#f5b660);--err:light-dark(#b3261e,#ff8a80);--errs:light-dark(#fbe9e7,#3b1a17);--ok:light-dark(#2f6b2f,#8fd18f);--oks:light-dark(#e8f3e3,#1d2e1b);--warn:light-dark(#8a5a00,#f2c46d);--warns:light-dark(#fff4dc,#33290f);--bar:light-dark(#b9ad93,#6b624d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Onest,"Golos Text",sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(3vw,16px)}
header{background:var(--band);color:#f4efe3}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-top:28px;padding-bottom:18px}
.top h1{font-size:clamp(24px,3.2vw,36px);max-width:22ch}
.top .sub{color:#d6ccb6;font-size:14px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.tl:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1d1406}
.btn.ghost{background:transparent;color:#f4efe3;border-color:#7d735e}
.btn.dang{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.status{font-size:14px;color:#f1e3c4;padding:6px 10px;border-radius:6px;background:#00000026}
.status.dirty{background:var(--acc);color:#1d1406;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{color:#e8dfca;text-decoration:none;padding:12px 16px;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:500}
.tab.on{background:var(--bg);color:var(--ink)}
main{padding:28px 0 64px}
.note{font-size:14px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font:700 clamp(28px,3vw,38px)/1.05 Onest,sans-serif}
.kpi span{font-size:14px;color:var(--mut)}
.per{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;font-size:16px;width:100%}
.per select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
.card h3{font-size:18px;display:flex;gap:10px;align-items:baseline}
.qn{flex:none;background:var(--band);color:#f4efe3;font:700 14px/1 Onest;padding:6px 8px;border-radius:6px}
.card .scope{font-size:13px;color:var(--mut);margin:6px 0 12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;background:var(--bar);border-radius:3px}td.d{white-space:nowrap}
.bar.a{background:var(--acc)}
.brow{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.brow .n{text-align:right;font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.minis h4{margin:4px 0 4px;font-size:14px}
.up{color:var(--err)}.dn{color:var(--ok)}
details{margin-top:12px;font-size:14px}summary{cursor:pointer;color:var(--acct);font-weight:500;min-height:32px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:5px;background:var(--accs);color:var(--acct);font-weight:600;white-space:nowrap}
.tag.e{background:var(--errs);color:var(--err)}.tag.w{background:var(--warns);color:var(--warn)}.tag.o{background:var(--oks);color:var(--ok)}
.split{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:8px 0}
.dlay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}
.tlist{display:flex;flex-direction:column;gap:2px}
.tlist h4{font-size:12px;color:var(--mut);margin:12px 8px 4px;font-weight:600}
.tl{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;font-size:15px;min-height:40px}
.tl:hover{background:var(--card)}.tl.on{background:var(--card);box-shadow:inset 3px 0 0 var(--acc);font-weight:600}
.tl small{color:var(--mut);font-variant-numeric:tabular-nums}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.tbar input{max-width:320px}
.scroll{overflow-x:auto}.lim{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}.lim th{position:sticky;top:0;background:var(--card);z-index:1}
.dt tr.r{cursor:pointer}.dt tr.r:hover td{background:var(--accs)}
.dt td{max-width:280px;overflow-wrap:anywhere}
.form{background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:18px;margin-bottom:18px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px;margin:12px 0}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.fg label.ck{flex-direction:row;align-items:center;gap:10px;min-height:44px;align-self:end}
.fg label.ck input{width:22px;min-height:22px;height:22px}
.fg .h{font-weight:400;color:var(--mut);font-size:13px}
.fg .er{color:var(--err);font-size:13px;font-weight:500}
.req{color:var(--err)}
.msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15px}
.msg.e{background:var(--errs);color:var(--err)}.msg.o{background:var(--oks);color:var(--ok)}.msg.w{background:var(--warns);color:var(--warn)}
.rule{border-bottom:1px solid var(--line);padding:12px 0}
.rule .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rule ul{margin:8px 0 0;padding-left:20px;font-size:14px}
.rule li button{background:none;border:0;padding:0;color:var(--acct);cursor:pointer;text-decoration:underline;font-size:14px}
.erd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:80vh}
.dict h3{margin:26px 0 4px;font-size:18px}
.dict p{margin:4px 0 10px;font-size:14px;color:var(--mut)}
@media(max-width:860px){.dlay{grid-template-columns:1fr}.tlist{flex-direction:row;flex-wrap:wrap}.tlist h4{width:100%}.tl{flex:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.brow{grid-template-columns:minmax(0,8em) minmax(0,1fr) 2.6em}}
@media(prefers-reduced-motion:no-preference){.form{animation:fi .25s ease-out}@keyframes fi{from{opacity:0;transform:translateY(-6px)}}}

function prevP(p,ty){if(ty==='year')return String(+p-1);if(ty==='quarter'){let y=+p.slice(0,4),q=+p.slice(6);q--;if(!q){q=4;y--}return y+'-Q'+q}let y=+p.slice(0,4),m=+p.slice(5,7)-1;if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')}

function rules(){
 const R=[];const add=(title,sev,items,why)=>R.push({title,sev,items,why});
 {const it=[],seen={},sid={};for(const o of DB.osoba){const k=norm(o.prizvyshche)+'|'+norm(o.imia)+'|'+o.data_nar;if(seen[k])it.push({t:'osoba',id:o.id,m:`${lab('osoba',o.id)} збігається з записом №${seen[k]} (ПІБ і дата народження)`});else seen[k]=o.id;const i=norm(o.ident);if(i&&sid[i])it.push({t:'osoba',id:o.id,m:`ідентифікатор ${o.ident} уже має запис №${sid[i]}`});else sid[i]=o.id}
 add('Одна особа вноситься один раз','e',it,'Збіг прізвища, імені та дати народження (без урахування регістру й апострофів) або ідентифікатора означає дублікат.')}
 {const it=[],seen={};for(const e of DB.epizod)for(const u of suspOf(e.id)){const k=e.provadzhennia_id+'|'+e.data+'|'+u.osoba_id+'|'+artsOf(e.id).join();if(seen[k])it.push({t:'epizod',id:e.id,m:`Е${e.id} повторює Е${seen[k]}: те саме провадження, дата, особа і стаття`});else seen[k]=e.id}

 {const it=[];for(const e of DB.epizod){const p=get('provadzhennia',e.provadzhennia_id);if(p&&e.data>p.data_erdr)it.push({t:'epizod',id:e.id,m:`Е${e.id}: дата вчинення ${fd(e.data)} пізніша за внесення до ЄРДР ${fd(p.data_erdr)}`})}

 {const it=[];for(const p of DB.provadzhennia){const st=DB.etap.filter(s=>s.provadzhennia_id===p.id).map(s=>({s,o:(get('d_etap',s.vyd_id)||{}).poriadok||0})).sort((a,b)=>a.o-b.o);let mx=p.data_erdr,mxl='внесення до ЄРДР';for(const x of st){if(x.s.data<mx)it.push({t:'etap',id:x.s.id,m:`${lab('provadzhennia',p.id)}: «${lab('d_etap',x.s.vyd_id)}» ${fd(x.s.data)} раніше, ніж ${mxl} ${fd(mx)}`});if(x.s.data>mx){mx=x.s.data;mxl='«'+lab('d_etap',x.s.vyd_id)+'»'}}}
 add('Етапи провадження йдуть у хронологічному порядку','e',it,'ЄРДР ≤ підозра ≤ скерування до суду ≤ рішення суду; закриття — не раніше попередніх етапів.')}
 {const it=[];for(const e of DB.epizod){const k=kvOf(e.id);if(!k.length)it.push({t:'epizod',id:e.id,m:`Е${e.id}: немає чинної кваліфікації`});const s=k.map(x=>x.stattia_id);if(new Set(s).size<s.length)it.push({t:'epizod',id:e.id,m:`Е${e.id}: дві чинні кваліфікації за однією статтею`})}
 add('У кожного епізоду є чинна кваліфікація','e',it,'Перекваліфікація не стирає попередній рядок, а робить його нечинним.')}
 {const it=[];for(const e of DB.epizod)if(!suspOf(e.id).length)it.push({t:'epizod',id:e.id,m:`Е${e.id}: не вказано підозрюваного`});add('У кожного епізоду є підозрюваний','w',it,'Без особи не можна підрахувати повторність і обставини.')}
 {const it=[];for(const z of DB.szch){const u=get('uchasnyk',z.uchasnyk_id);if(!u)continue;const ok=kvOf(u.epizod_id).some(k=>(get('d_stattia',k.stattia_id)||{}).szch);if(!ok)it.push({t:'szch',id:z.id,m:`${lab('szch',z.id)}: епізод не кваліфіковано за ст. 407 або 408`});if(!isSusp(u))it.push({t:'szch',id:z.id,m:`${lab('szch',z.id)}: відомості про СЗЧ можна вносити лише щодо підозрюваного`})}

 {const it=[];for(const s of DB.sud){const u=get('uchasnyk',s.uchasnyk_id);const r=get('d_rishennia',s.rishennia_id)||{};const p=get('d_pokarannia',s.pokarannia_id);const L2=lab('sud',s.id);if(u&&!isSusp(u))it.push({t:'sud',id:s.id,m:L2+': рішення можна вносити лише щодо підозрюваного'});if(r.vyrok&&!p)it.push({t:'sud',id:s.id,m:L2+': для обвинувального вироку потрібен вид покарання'});if(!r.vyrok&&(p||s.strok))it.push({t:'sud',id:s.id,m:L2+': покарання вказано без обвинувального вироку'});if(p&&p.strokove&&!s.strok)it.push({t:'sud',id:s.id,m:L2+': не вказано строк покарання'});if(r.vyprob&&!s.vyprob)it.push({t:'sud',id:s.id,m:L2+': не вказано іспитовий строк'});if(!r.vyprob&&s.vyprob)it.push({t:'sud',id:s.id,m:L2+': іспитовий строк лише для звільнення з випробуванням'});if(u){const sk=DB.etap.filter(e=>e.provadzhennia_id===(get('epizod',u.epizod_id)||{}).provadzhennia_id&&(get('d_etap',e.vyd_id)||{}).poriadok===3).map(e=>e.data).sort()[0];if(sk&&s.data<sk)it.push({t:'sud',id:s.id,m:L2+': рішення раніше за скерування до суду'})}}
 add('Поля рішення суду залежать від виду рішення','e',it,'Покарання — лише за обвинувального вироку; іспитовий строк — лише при звільненні з випробуванням; дата — не раніше скерування до суду.')}
 {const it=[];for(const m of DB.maino){const ok=kvOf(m.epizod_id).some(k=>(get('d_stattia',k.stattia_id)||{}).maino);if(!ok)it.push({t:'maino',id:m.id,m:`${m.naimenuvannia}: стаття епізоду Е${m.epizod_id} не стосується військового майна`})}
 add('Майно вноситься для статей про військове майно','w',it,'Ст. 410–413 мають предметом майно; для інших складів перевірте, чи потрібен запис.')}
 {const it=[];for(const u of DB.uchasnyk){const o=get('osoba',u.osoba_id),e=get('epizod',u.epizod_id);if(!o||!e)continue;if(o.data_nar>=e.data)it.push({t:'osoba',id:o.id,m:`${lab('osoba',o.id)}: дата народження не раніше дати вчинення`});else if(isSusp(u)&&days(o.data_nar,e.data)<18*365.25)it.push({t:'osoba',id:o.id,m:`${lab('osoba',o.id)}: на момент вчинення Е${e.id} молодше 18 років`});if(o.data_sluzhby&&o.data_sluzhby>e.data&&isSusp(u))it.push({t:'osoba',id:o.id,m:`${lab('osoba',o.id)}: служба почалася після дати вчинення Е${e.id}`})}
 add('Вік і строк служби на момент вчинення правдоподібні','e',it,'Суб\'єкт військового правопорушення — повнолітній, уже на службі.')}
 {const it=[];const chk=(t,f)=>{for(const r of DB[t])if(r[f]&&r[f]>TODAY)it.push({t,id:r.id,m:`${S[t].t} №${r.id}: дата ${fd(r[f])} у майбутньому`})};chk('epizod','data');chk('provadzhennia','data_erdr');chk('etap','data');chk('sud','data');chk('szch','data_pov');

 {const it=[];for(const e of DB.epizod){const m=e.data.slice(0,7);if(!DB.chyselnist.some(c=>c.chastyna_id===e.chastyna_id&&c.misiats===m))it.push({t:'epizod',id:e.id,m:`Е${e.id}: немає чисельності ${lab('chastyna',e.chastyna_id)} за ${m}`})}

/* analytics */
function bars(list,acc){const mx=Math.max(1,...list.map(x=>x[1]));return list.map(([k,n])=>`<div class="brow"><span>${esc(k)}</span><div class="bar ${acc?'a':''}" style="width:${n/mx*100}%"></div><span class="n">${num(n)}</span></div>`).join('')||'<div class="note">Немає даних</div>'}
function countBy(arr,fn){const m=new Map();for(const x of arr){const k=fn(x);m.set(k,(m.get(k)||0)+1)}return[...m].sort((a,b)=>b[1]-a[1])}

function vData(){
 const s=S[CUR];const grp=(g,l)=>`<h4>${l}</h4>`+TABLES.filter(t=>S[t].g===g).map(t=>`<button class="tl ${t===CUR?'on':''}" data-t="${t}"><span>${esc(S[t].t)}</span><small>${DB[t].length}</small></button>`).join('');
 const q=norm(Q);const rows=DB[CUR].filter(r=>!q||norm(s.f.map(f=>f.type==='ref'?lab(f.ref,r[f.k]):r[f.k]).join(' ')+' '+r.id).includes(q));
 return `<div class="dlay"><aside class="tlist">${grp('m','Основні таблиці')}${grp('d','Довідники')}</aside><section>
 <h2 style="font-size:24px">${esc(s.t)}</h2><p class="note" style="margin:6px 0 0">${esc(s.p)}</p>
 <div class="tbar"><input id="q" type="search" placeholder="Пошук у таблиці" value="${esc(Q)}" aria-label="Пошук"><button class="btn pri" id="add">Додати запис</button><span class="note">${rows.length} з ${DB[CUR].length}</span></div>
 ${EDIT!=null?vForm():''}
 <div class="scroll lim" style="max-height:70vh"><table class="dt stack"><thead><tr><th class="n">№</th>${s.f.map(f=>`<th>${esc(f.l)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="r" data-id="${r.id}" tabindex="0"><td class="n">${r.id}</td>${s.f.map(f=>`<td${f.type==='date'||f.type==='month'?' class="d"':''}>${fmtCell(f,r[f.k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${s.f.length+1}" class="note">Записів немає</td></tr>`}</tbody></table></div></section></div>`}
function vForm(){
 const s=S[CUR];const r=EDIT==='new'?{}:get(CUR,EDIT)||{};
 const inp=f=>{const v=r[f.k];const id='f_'+f.k;const er=ERR[f.k]?`<span class="er">${esc(ERR[f.k])}</span>`:'';const lb=`${esc(f.l)}${f.req?' <span class="req">*</span>':''}`;const hint=f.note?`<span class="h">${esc(f.note)}</span>`:'';
  if(f.type==='bool')return `<label class="ck"><input type="checkbox" id="${id}" ${v?'checked':''}>${lb}</label>`;
  if(f.type==='ref'){const opts=DB[f.ref].map(x=>[x.id,lab(f.ref,x.id)]).sort((a,b)=>a[1].localeCompare(b[1],'uk'));return `<label>${lb}<select id="${id}"><option value="">${f.req?'— оберіть —':'не вказано'}</option>${opts.map(([i,l])=>`<option value="${i}" ${+v===i?'selected':''}>${esc(l)}</option>`).join('')}</select>${hint}${er}</label>`}
  if(f.type==='enum')return `<label>${lb}<select id="${id}"><option value="">— оберіть —</option>${f.en.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${hint}${er}</label>`;
  if(f.type==='textarea')return `<label style="grid-column:1/-1">${lb}<textarea id="${id}" rows="2">${esc(v)}</textarea>${er}</label>`;
  const ty=f.type==='date'?'date':f.type==='month'?'month':(f.type==='int'||f.type==='num')?'number':'text';
  return `<label>${lb}<input id="${id}" type="${ty}" ${f.type==='num'?'step="any"':''} value="${esc(v==null?'':v)}" placeholder="${esc(f.ex||'')}">${hint}${er}</label>`};
 return `<form class="form" id="frm" novalidate><h3 style="font-size:18px">${EDIT==='new'?'Новий запис':'Запис №'+EDIT}: ${esc(s.t)}</h3><div class="fg">${s.f.map(inp).join('')}</div>${ERR._?`<div class="msg e">${esc(ERR._)}</div>`:''}
 <div class="acts"><button class="btn pri" type="submit">Зберегти запис</button><button class="btn" type="button" id="cancel">Закрити</button>${EDIT!=='new'?`<button class="btn dang" type="button" id="del">${CONF===EDIT?'Так, видалити запис':'Видалити'}</button>`:''}</div></form>`}
function submitForm(){
 const s=S[CUR];const o={};ERR={};
 for(const f of s.f){const el=document.getElementById('f_'+f.k);let v;
  if(f.type==='bool')v=el.checked;else{v=el.value.trim();if(v==='')v=null;else if(f.type==='ref')v=+v;else if(f.type==='int'){v=Number(v);if(!Number.isInteger(v))ERR[f.k]='Потрібне ціле число'}else if(f.type==='num'){v=Number(v);if(isNaN(v))ERR[f.k]='Потрібне число'}}
  if(f.req&&(v==null))ERR[f.k]='Обов\'язкове поле';
  if(v!=null&&f.min!=null&&typeof v==='number'&&v<f.min)ERR[f.k]='Не менше '+f.min;
  if(v!=null&&f.uniq&&DB[CUR].some(x=>x.id!==EDIT&&norm(x[f.k])===norm(v)))ERR[f.k]='Таке значення вже є в таблиці';
  o[f.k]=v}
 if(Object.keys(ERR).length){ERR._='Виправте позначені поля';render();return}
 if(EDIT==='new'){const id=Math.max(0,...DB[CUR].map(x=>x.id))+1;DB[CUR].push(Object.assign({id},o));FLASH=['o',`Запис №${id} додано. Не забудьте натиснути «Зберегти зміни».`]}
 else{Object.assign(get(CUR,EDIT),o);FLASH=['o',`Запис №${EDIT} оновлено.`]}
 EDIT=null;CONF=null;touch();const p=rules().filter(r=>r.sev==='e'&&r.items.length);if(p.length)FLASH=['w',FLASH[1]+' Контроль якості виявив помилки: '+p.map(r=>r.title).join('; ')+'.'];render()}
function refsTo(t,id){const out=[];for(const t2 of TABLES)for(const f of S[t2].f)if(f.type==='ref'&&f.ref===t){const n=DB[t2].filter(r=>r[f.k]===id).length;if(n)out.push(S[t2].t+' ('+n+')')}return out}
function delRec(){const refs=refsTo(CUR,EDIT);if(refs.length){ERR={_:'Запис не можна видалити: на нього посилаються '+refs.join(', ')+'. Спочатку змініть або видаліть ці записи.'};CONF=null;render();return}
 DB[CUR]=DB[CUR].filter(r=>r.id!==EDIT);FLASH=['o',`Запис №${EDIT} видалено.`];EDIT=null;CONF=null;touch();render()}

/* checks */
function vChecks(){const R=rules();const bad=R.filter(r=>r.items.length).length;
 return `<h2 style="font-size:24px">Контроль якості даних</h2><p class="note" style="margin:6px 0 14px">${R.length} правил перевіряють усю базу після кожної зміни. Помилки (червоні) спотворюють підрахунки, попередження (жовті) потребують уваги.</p>
 <div class="msg ${bad?'w':'o'}">${bad?`Правил із порушеннями: ${bad} з ${R.length}`:'Усі правила виконано, порушень немає.'}</div>
 <div class="card">${R.map((r,i)=>`<div class="rule"><div class="hd"><span class="tag ${r.items.length?(r.sev==='e'?'e':'w'):'o'}">${r.items.length?(r.sev==='e'?'помилок: ':'попереджень: ')+r.items.length:'виконано'}</span><strong>${i+1}. ${esc(r.title)}</strong></div><div class="note">${esc(r.why)}</div>${r.items.length?`<ul>${r.items.map(x=>`<li><button data-go="${x.t}:${x.id}">${esc(x.m)}</button></li>`).join('')}</ul>`:''}</div>`).join('')}</div>
 <p class="note">Захист на рівні форми: обов'язкові поля, типи даних (ціле число, дата, значення з довідника), унікальність номерів та ідентифікаторів, заборона видаляти запис, на який є посилання. «Невідомо» і «не застосовується» — окремі значення, а не порожнє поле.</p>`}

/* schema */
const TY={text:'текст',textarea:'текст',int:'ціле число',num:'число',date:'дата',month:'місяць (РРРР-ММ)',bool:'так/ні',ref:'значення з таблиці (FK)',enum:'значення з переліку'};
function vSchema(){
 return `<h2 style="font-size:24px">ER-схема і словник даних</h2><p class="note" style="margin:6px 0 12px">Схема будується автоматично зі структури бази. Назви таблиць і полів українською; зовнішній ключ має ту саму назву, що й первинний ключ таблиці, на яку він посилається. PK — первинний ключ, FK — зовнішній ключ. «Багато до багатьох» реалізовано через проміжні таблиці «Учасник епізоду» (особа ↔ епізод) і «Кваліфікація» (епізод ↔ стаття КК).</p>
 <label class="note" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="showd" style="width:20px;min-height:20px" ${SHOWD?'checked':''}> Показати довідники на схемі</label>
 <div class="erd" id="erd"><div class="note" style="color:#6f6857">Будується схема…</div></div>
 <div class="dict">${TABLES.map(t=>{const s=S[t];return `<h3>${esc(s.t)} <span class="note" style="font-size:14px;font-weight:400">· таблиця <code>${TN[t]}</code>${s.g==='d'?' · довідник':''}</span></h3><p>${esc(s.p)} Первинний ключ: <code>${PKN[t]}</code>.</p><div class="scroll"><table class="stack"><thead><tr><th>Поле</th><th>Назва</th><th>Тип даних</th><th>Обов'язкове</th><th>Допустимі значення / довідник</th><th>Приклад</th><th>Джерело, примітка</th></tr></thead><tbody><tr><td><code>${PKN[t]}</code> PK</td><td>Код запису</td><td>ціле число</td><td>так</td><td>унікальне</td><td>1</td><td>присвоюється автоматично</td></tr>${s.f.map(f=>`<tr><td><code>${fn(t,f)}</code>${f.type==='ref'?' FK':''}</td><td>${esc(f.l)}</td><td>${TY[f.type]}</td><td>${f.req?'так':'ні'}</td><td>${f.type==='ref'?'→ '+esc(TN[f.ref]):f.en?esc(f.en.join(' / ')):f.uniq?'унікальне':f.min!=null?'≥ '+f.min:''}</td><td>${esc(f.ex||'')}</td><td>${esc([f.src,f.note].filter(Boolean).join('. '))}</td></tr>`).join('')}</tbody></table></div>`}).join('')}
 <h3>Обчислювані показники (у базі не зберігаються)</h3><table class="stack"><thead><tr><th>Показник</th><th>Як обчислюється</th></tr></thead><tbody>${[['Вік на момент вчинення','особа.дата_народження і епізод.дата_вчинення'],['Строк служби на момент вчинення','особа.дата_початку_служби і епізод.дата_вчинення'],['Тривалість відсутності (СЗЧ)','сзч.дата_повернення − сзч.дата_залишення; без дати повернення — до сьогодні'],['Поточний стан провадження','останній запис етап_провадження за датою'],['Тривалість етапів','різниця дат у таблиці етап_провадження'],['Кількість правопорушень','COUNT епізодів з чинною кваліфікацією'],['Показник на 100 осіб','епізоди × 100 / середня чисельність.кількість за місяці періоду'],['Повторність','кількість різних епізодів, де особа — підозрюваний']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`}
function loadScript(src,g){return new Promise((res,rej)=>{if(window[g])return res(window[g]);const s=document.createElement('script');s.src=src;s.onload=()=>res(window[g]);s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const TRL={а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'iu',я:'ia'};
function erdSrc(){const ts=TABLES.filter(t=>SHOWD||S[t].g==='m');const MAP={},used=new Set();
 const ph=(uk,id)=>{let a=[...uk.toLowerCase()].map(c=>TRL[c]!==undefined?TRL[c]:/[a-z0-9_ ]/.test(c)?c:'').join('');if(id)a=a.replace(/ /g,'_');if(!/^[a-z]/.test(a))a='x'+a;let b=a,n=2;while(used.has(b)&&MAP[b]!==uk)b=a+(id?'_':' ')+n++;used.add(b);MAP[b]=uk;return b};
 let s='erDiagram\n';const mt={text:'string',textarea:'string',int:'int',num:'float',date:'date',month:'string',bool:'bool',ref:'int',enum:'string'};
 for(const t of ts){s+=`  ${ph(TN[t],1)} {\n    int ${ph(PKN[t],1)} PK\n`;for(const f of S[t].f){if(f.type==='ref'&&!ts.includes(f.ref))continue;s+=`    ${mt[f.type]} ${ph(fn(t,f),1)}${f.type==='ref'?' FK':''}\n`}s+='  }\n'}
 for(const t of ts)for(const f of S[t].f)if(f.type==='ref'&&ts.includes(f.ref))s+=`  ${ph(TN[f.ref],1)} ${f.req?'||':'|o'}--${f.one?'o|':'o{'} ${ph(TN[t],1)} : "${ph(f.l.replace(/"/g,''),0)}"\n`;return{s,MAP}}
async function drawErd(){const box=document.getElementById('erd');const{s:src,MAP}=erdSrc();try{const m=await loadScript('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js','mermaid');m.initialize({startOnLoad:false,theme:'base',themeVariables:{primaryColor:'#f4f1ea',primaryBorderColor:'#4a4232',lineColor:'#6f6857',primaryTextColor:'#2a261d',fontFamily:'Golos Text, sans-serif',fontSize:'13px'}});const out=await m.render('erdsvg'+Date.now(),src);if(document.getElementById('erd')!==box)return;box.innerHTML=out.svg;const w=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(MAP[k])n.nodeValue=n.nodeValue.replace(k,MAP[k])}}catch(e){let txt=src;for(const k of Object.keys(MAP).sort((a,b)=>b.length-a.length))txt=txt.split(k).join(MAP[k]);box.innerHTML='<div class="note" style="color:#6f6857">Не вдалося завантажити бібліотеку для схеми. Текст схеми:</div><pre>'+esc(txt)+'</pre>'}}

/* binding */
function bindTop(){
 const $=id=>document.getElementById(id);
 $('save').onclick=save;$('undo').onclick=()=>{try{localStorage.removeItem(DRAFT_KEY)}catch(e){}DB=fromStore(SAVED);dirty=false;reindex();EDIT=null;FLASH=['o','Незбережені зміни скасовано.'];render()};
 $('xls').onclick=exportXlsx;$('json').onclick=()=>download('baza_danykh_rezervna_kopiia.json',JSON.stringify({v:1,savedAt:SAVED.savedAt,t:toStore()},null,1));
 $('imp').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.t)throw 0;DB=fromStore(d);touch();FLASH=['o','Дані імпортовано з файлу. Перевірте їх і натисніть «Зберегти зміни».']}catch(e){FLASH=['e','Файл не схожий на резервну копію цієї бази.']}render()};
}
function bindView(){
 const $=id=>document.getElementById(id);
 if(VIEW==='analytics'){$('pt').onchange=e=>{PT=e.target.value;PV=null;render()};$('pv').onchange=e=>{PV=e.target.value;render()}}
 if(VIEW==='data'){
  document.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{CUR=b.dataset.t;EDIT=null;Q='';ERR={};render()});
  $('q').oninput=e=>{Q=e.target.value;const pos=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)};
  $('add').onclick=()=>{EDIT='new';ERR={};CONF=null;render();$('frm').scrollIntoView({block:'nearest'})};
  document.querySelectorAll('tr.r').forEach(tr=>{const go=()=>{EDIT=+tr.dataset.id;ERR={};CONF=null;render();$('frm').scrollIntoView({block:'nearest'})};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  if($('frm')){$('frm').onsubmit=e=>{e.preventDefault();submitForm()};$('cancel').onclick=()=>{EDIT=null;ERR={};render()};if($('del'))$('del').onclick=()=>{if(CONF===EDIT)delRec();else{CONF=EDIT;render()}}}
 }
 if(VIEW==='checks')document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const[t,id]=b.dataset.go.split(':');CUR=t;EDIT=+id;ERR={};location.hash='data';if(VIEW==='data')render()});
 if(VIEW==='schema')$('showd').onchange=e=>{SHOWD=e.target.checked;$('erd').innerHTML='<div class="note" style="color:#6f6857">Будується схема…</div>';drawErd()};
}

/* save / export */
function buildHtml(){const st=JSON.stringify({v:1,savedAt:new Date().toISOString(),t:toStore()}).replace(/</g,'\\u003c');
 const SC='scr'+'ipt';return '<!DOCTYPE html>\n<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n<title>База військових правопорушень</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet">\n<style id="css">'+CSS_TXT+'</style></head><body>\n<div id="app"></div>\n<'+SC+' id="db" type="application/json">'+st+'</'+SC+'>\n<'+SC+' id="appjs">'+APP_TXT+'</'+SC+'>\n</body></html>'}
async function save(){const st=document.getElementById('st');if(!ART){st.textContent=artReady?'Збереження недоступне в цьому перегляді':'Зачекайте кілька секунд…';FLASH=['w',artReady?'Тут базу не можна зберегти на сервер. Зміни лишаються у вашому браузері — зробіть резервну копію або експорт у Excel.':'Збереження ще підключається, спробуйте за кілька секунд.'];render();return}
 st.textContent='Зберігаю…';try{await ART.publish(buildHtml());try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}catch(e){const c=e&&e.code;FLASH=c==='conflict'?['w','Базу щойно змінено в іншому вікні. Сторінка оновиться до останньої версії.']:['e',c==='not_granted'||c==='not_writer'?'У вас немає права змінювати цю базу — доступний лише перегляд.':'Не вдалося зберегти: '+(e&&e.message||c||'невідома помилка')];render()}}
async function download(name,data){if(!DL){FLASH=['w',artReady?'Завантаження файлів недоступне в цьому перегляді.':'Завантаження ще підключається, спробуйте за кілька секунд.'];render();return}
 try{await DL.save({filename:name,data})}catch(e){if(e&&e.code!=='declined'){FLASH=['e','Не вдалося зберегти файл: '+(e.message||e.code)];render()}}}
async function exportXlsx(){let X;try{X=await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX')}catch(e){FLASH=['e','Не вдалося завантажити бібліотеку Excel.'];render();return}
 const wb=X.utils.book_new();const used=new Set();
 const sheet=(name,aoa)=>{let n=name.replace(/[\\\/?*\[\]:]/g,'').slice(0,31);let i=2;while(used.has(n)){n=n.slice(0,28)+' '+i++}used.add(n);X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(aoa),n)};
 for(const t of TABLES){const f=S[t].f;const head=[PKN[t]];for(const x of f){head.push(fn(t,x));if(x.type==='ref')head.push(fn(t,x)+' (назва)')}
  const rows=DB[t].map(r=>{const a=[r.id];for(const x of f){let v=r[x.k];if(x.type==='bool')v=v?'так':'ні';a.push(v==null?'':v);if(x.type==='ref')a.push(v==null?'':lab(x.ref,v))}return a});sheet(S[t].t,[head,...rows])}
 const dict=[['Таблиця','Поле','Назва','Тип даних','Обов\'язкове','Допустимі значення / довідник','Приклад','Джерело, примітка']];
 for(const t of TABLES){dict.push([TN[t],PKN[t]+' (PK)','Код запису','ціле число','так','унікальне','1','присвоюється автоматично']);for(const f of S[t].f)dict.push([TN[t],fn(t,f)+(f.type==='ref'?' (FK)':''),f.l,TY[f.type],f.req?'так':'ні',f.type==='ref'?'→ '+TN[f.ref]:f.en?f.en.join(' / '):f.uniq?'унікальне':'',f.ex||'',[f.src,f.note].filter(Boolean).join('. ')])}
 sheet('Словник даних',dict);
 const rr=[['№','Правило','Тип','Порушень','Пояснення']];rules().forEach((r,i)=>rr.push([i+1,r.title,r.sev==='e'?'помилка':'попередження',r.items.length,r.why]));sheet('Правила якості',rr);
 const buf=X.write(wb,{bookType:'xlsx',type:'array'});download('baza_danykh_viiskovi_pravoporushennia.xlsx',new Blob([buf]))}

window.addEventListener('hashchange',route);
route();
ART={publish:async()=>{const st={v:1,savedAt:new Date().toISOString(),t:toStore()};localStorage.setItem(SAVED_KEY,JSON.stringify(st));localStorage.removeItem(DRAFT_KEY);location.reload()}};
DL={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};
artReady=true;
}
